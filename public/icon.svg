<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="flameInner" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#7f1d1d" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle / Shield Badge -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#fca5a5" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Main Flame Shape (Lucide/Heroicons Flame Style, Bold & Distinctive) -->
  <g transform="translate(106, 86) scale(12.5)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path fill="#ffffff" stroke="#ffffff" d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
    <!-- Inner Ember Accent -->
    <path fill="url(#flameInner)" stroke="none" d="M10 16a2 2 0 0 0 2-2c0-1-.5-1.5-1-2-.5 1-1 1.5-1 2a2 2 0 0 0 0 2z" opacity="0.95"/>
  </g>
</svg>